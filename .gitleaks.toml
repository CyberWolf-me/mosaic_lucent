title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore test fixtures and documentation false positives"
paths = [
  '''packages/server/test/.*''',
  '''packages/server/scripts/.*''',
  '''scripts/.*''',
  '''docs/.*''',
  '''packages/server/src/ssoStore\.ts''',
  # The Playwright suites sign up throwaway accounts against a local mock
  # provider, so their credential literals are fixtures, not secrets. The
  # detectors cannot tell the difference: `signUp(name, password = "...")` in
  # e2e/journeys/fixtures.ts matches `generic-api-key` on the parameter name
  # alone. Allowlisting the whole e2e tree rather than that one line keeps a
  # renamed variable from re-reddening the security job for the same non-reason
  # -- and nothing here can reach production, since these credentials only ever
  # authenticate to the CI-local server the suite boots.
  '''packages/web/e2e/.*'''
]
stopwords = [
  "lucent-verify"
]
